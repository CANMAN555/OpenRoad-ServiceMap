name: Probe locator feeds
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-ta.mjs
        continue-on-error: true
      - run: node scripts/update-freightliner.mjs
        continue-on-error: true
      - run: node scripts/update-volvo.mjs
        continue-on-error: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ta.json data/freightliner.json data/volvo.json && git commit -qm "probe output" && git push
