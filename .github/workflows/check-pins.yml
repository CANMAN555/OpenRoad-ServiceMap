name: Check pin locations

# Compares every company pin with the U.S. Census geocoder's point for the same street address. Pins
# more than half a mile off get a second opinion from addresses mapped in OpenStreetMap, and a pin is
# moved only when both agree on another spot. Moves are saved in data/pin-fixes.json and applied to
# the company files; the weekly updates keep applying them. Runs Mondays after the company updates.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 11 * * 1" # Mondays 11:07 UTC, after the Love's and other company updates
  push:
    branches: [main]
    paths:
      - scripts/check-pins.mjs
      - .github/workflows/check-pins.yml

permissions:
  contents: write

concurrency:
  group: check-pins
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-pins.mjs --apply
      - uses: actions/upload-artifact@v4
        with:
          name: pin-check
          path: pin-check.json
          retention-days: 14
      - name: Commit if changed
        run: |
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move pins that the Census and OpenStreetMap both place elsewhere"
          git pull --rebase origin main
          git push
