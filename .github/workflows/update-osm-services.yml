name: Update OpenStreetMap locksmiths and glass repair

on:
  workflow_dispatch:
  schedule:
    - cron: "52 10 * * 1"   # Mondays
  push:
    branches: [main]
    paths:
      - scripts/update-osm-services.mjs
      - .github/workflows/update-osm-services.yml

permissions:
  contents: write

concurrency:
  group: update-osm-services
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-osm-services.mjs
      - name: Commit if changed
        run: |
          git add data/locksmiths.json data/glass.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update locksmiths and glass repair from OpenStreetMap"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push
