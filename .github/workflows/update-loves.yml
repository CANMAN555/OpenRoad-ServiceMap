name: Update Love's locations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  push:
    branches: [main]
    paths:
      - scripts/update-loves.mjs
      - .github/workflows/update-loves.yml

permissions:
  contents: write

concurrency:
  group: update-loves
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-loves.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/loves.json && git ls-files --error-unmatch data/loves.json >/dev/null 2>&1; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/loves.json
          git commit -m "Update Love's locations from loves.com"
          git push
