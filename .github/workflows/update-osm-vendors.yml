name: Update OpenStreetMap vendor listings

# Downloads the OpenStreetMap extracts for the U.S., Canada and Mexico from Geofabrik, keeps only
# truck repair, tire, towing, truck stop and dealer listings, and writes them to data/osm/ in
# 2-degree tiles. The site searches these files in the browser, so searches never wait on a
# public server and work at any radius.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  push:
    branches: [main]
    paths:
      - scripts/build-osm-vendors.py
      - .github/workflows/update-osm-vendors.yml

permissions:
  contents: write

concurrency:
  group: update-osm-vendors
  cancel-in-progress: false

jobs:
  # One job per region, side by side, so one slow download doesn't hold up the rest.
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        region: [us-midwest, us-northeast, us-pacific, us-south, us-west, canada, mexico]
    steps:
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download
        run: |
          url="https://download.geofabrik.de/north-america/${{ matrix.region }}-latest.osm.pbf"
          # A stalled transfer (under 500 KB/s for 2 minutes) is dropped and resumed where it stopped.
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL -C - --speed-limit 500000 --speed-time 120 -o region.osm.pbf "$url" && break
            echo "Attempt $i stopped; resuming"
            sleep 10
          done
          osmium fileinfo region.osm.pbf | head -20
      - name: Keep vendor candidates
        # osmium wildcards are case-sensitive, so "towing" and "wrecker" are listed in both cases;
        # the build script then applies the exact rules.
        run: |
          osmium tags-filter -O -o ${{ matrix.region }}-vendors.osm.pbf region.osm.pbf \
            'nwr/shop=truck_repair,tyres,truck,car_repair' 'nwr/amenity=fuel' \
            'nwr/name=*owing' 'nwr/name=*OWING' 'nwr/name=*recker' 'nwr/name=*RECKER'
          ls -lh ${{ matrix.region }}-vendors.osm.pbf
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.region }}
          path: ${{ matrix.region }}-vendors.osm.pbf
          retention-days: 3

  build:
    needs: filter
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: work
          merge-multiple: true
      - name: Check every U.S. region arrived
        run: |
          ls -lh work
          for r in us-midwest us-northeast us-pacific us-south us-west; do
            [ -s "work/$r-vendors.osm.pbf" ] || { echo "Missing $r; keeping last week's listings"; exit 1; }
          done
      - name: Build tiles
        run: |
          python3 -m pip install --quiet osmium
          python3 scripts/build-osm-vendors.py work/*-vendors.osm.pbf
      - name: Commit if changed
        run: |
          git add -A data/osm
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update OpenStreetMap vendor listings"
          git pull --rebase origin main
          git push
