name: Update TA, Freightliner and Volvo locations

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1" # Mondays 09:37 UTC, after the Love's update
  push:
    branches: [main]
    paths:
      - scripts/lib.mjs
      - scripts/update-ta.mjs
      - scripts/update-freightliner.mjs
      - scripts/update-volvo.mjs
      - .github/workflows/update-vendors.yml

permissions:
  contents: write

concurrency:
  group: update-vendors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Each source runs on its own so one site being down doesn't block the others.
      - name: TA, Petro and TA Express
        run: node scripts/update-ta.mjs
        continue-on-error: true
      - name: Freightliner
        run: node scripts/update-freightliner.mjs
        continue-on-error: true
      - name: Volvo Trucks
        run: node scripts/update-volvo.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          for f in data/ta.json data/freightliner.json data/volvo.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update TA, Freightliner and Volvo locations"
          git pull --rebase origin main
          git push
