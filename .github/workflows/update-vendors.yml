name: Update brand locations (TA, Freightliner, Volvo, Boss, Utility, Prestige, Timpte, Thermo King, Carrier, FleetPride, Southern Tire Mart)

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1" # Mondays 09:37 UTC, after the Love's update
  push:
    branches: [main]
    paths:
      - scripts/lib.mjs
      - scripts/update-ta.mjs
      - scripts/update-freightliner.mjs
      - scripts/update-volvo.mjs
      - scripts/update-boss.mjs
      - scripts/update-utility.mjs
      - scripts/update-prestige.mjs
      - scripts/update-timpte.mjs
      - scripts/update-thermoking.mjs
      - scripts/update-carrier.mjs
      - scripts/update-fleetpride.mjs
      - scripts/update-stm.mjs
      - scripts/update-pomps.mjs
      - scripts/update-bauer.mjs
      - .github/workflows/update-vendors.yml

permissions:
  contents: write

concurrency:
  group: update-vendors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Each source runs on its own so one site being down doesn't block the others.
      - name: TA, Petro and TA Express
        id: ta
        run: node scripts/update-ta.mjs
        continue-on-error: true
      - name: Freightliner
        id: freightliner
        run: node scripts/update-freightliner.mjs
        continue-on-error: true
      - name: Volvo Trucks
        id: volvo
        run: node scripts/update-volvo.mjs
        continue-on-error: true
      - name: Boss Truck Shops
        id: boss
        run: node scripts/update-boss.mjs
        continue-on-error: true
      - name: Utility Trailer
        id: utility
        run: node scripts/update-utility.mjs
        continue-on-error: true
      - name: Prestige Trailers
        id: prestige
        run: node scripts/update-prestige.mjs
        continue-on-error: true
      - name: Timpte
        id: timpte
        run: node scripts/update-timpte.mjs
        continue-on-error: true
      - name: Thermo King
        id: thermoking
        run: node scripts/update-thermoking.mjs
        continue-on-error: true
      - name: Carrier Transicold
        id: carrier
        run: node scripts/update-carrier.mjs
        continue-on-error: true
      - name: FleetPride
        id: fleetpride
        run: node scripts/update-fleetpride.mjs
        continue-on-error: true
      - name: Southern Tire Mart
        id: stm
        run: node scripts/update-stm.mjs
        continue-on-error: true
      - name: Pomp's Tire
        id: pomps
        run: node scripts/update-pomps.mjs
        continue-on-error: true
      - name: Bauer Built
        id: bauer
        run: node scripts/update-bauer.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          for f in data/ta.json data/freightliner.json data/volvo.json data/boss.json data/utility.json data/prestige.json data/timpte.json data/thermoking.json data/carrier.json data/fleetpride.json data/stm.json data/pomps.json data/bauer.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update brand locations"
          git pull --rebase origin main
          git push
      - name: Report vendor updater failures
        if: always()
        env:
          TA_OUTCOME: ${{ steps.ta.outcome }}
          FREIGHTLINER_OUTCOME: ${{ steps.freightliner.outcome }}
          VOLVO_OUTCOME: ${{ steps.volvo.outcome }}
          BOSS_OUTCOME: ${{ steps.boss.outcome }}
          UTILITY_OUTCOME: ${{ steps.utility.outcome }}
          PRESTIGE_OUTCOME: ${{ steps.prestige.outcome }}
          TIMPTE_OUTCOME: ${{ steps.timpte.outcome }}
          THERMOKING_OUTCOME: ${{ steps.thermoking.outcome }}
          CARRIER_OUTCOME: ${{ steps.carrier.outcome }}
          FLEETPRIDE_OUTCOME: ${{ steps.fleetpride.outcome }}
          STM_OUTCOME: ${{ steps.stm.outcome }}
          POMPS_OUTCOME: ${{ steps.pomps.outcome }}
          BAUER_OUTCOME: ${{ steps.bauer.outcome }}
        run: node scripts/report-vendor-update-failures.mjs
