name: Add a vendor

# Runs when an "Add a vendor" request is opened or edited, when Claude labels it "checked-by-claude" after finding the
# vendor's website and hours, or when the map owner labels it "approved". The request text is read by
# scripts/add-vendor.mjs; it is never pasted into a shell command.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-vendor
  cancel-in-progress: false

jobs:
  check:
    # Requests from the map's form or the issue template start with "Add vendor:". Of the labels, only these two re-run it.
    if: >-
      startsWith(github.event.issue.title, 'Add vendor:') && github.event.issue.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'approved' || github.event.label.name == 'checked-by-claude')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make sure the request labels exist
        run: |
          gh label create add-vendor --color FF6B00 --description "Request to add a vendor to the map" --force || true
          gh label create approved --color 2E7D32 --description "Map owner approved this vendor request" --force || true
          gh label create needs-research --color FBC02D --description "Waiting for Claude to find the vendor's website and hours" --force || true
          gh label create checked-by-claude --color 1565C0 --description "Claude found the vendor's website and hours" --force || true
        env:
          GH_TOKEN: ${{ github.token }}
      - id: run
        run: node scripts/add-vendor.mjs
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save the new pin
        if: steps.run.outputs.added == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/added.json
          git commit -m "Add requested vendor (issue #${ISSUE})"
          git pull --rebase -X theirs origin main
          git push
        env:
          ISSUE: ${{ github.event.issue.number }}
      - name: Report back on the request
        if: always() && (hashFiles('comment.md') != '' || hashFiles('labels.txt') != '')
        run: |
          if [ -f comment.md ]; then gh issue comment "$ISSUE" --body-file comment.md; fi
          if [ -f labels.txt ]; then gh issue edit "$ISSUE" --add-label "$(cat labels.txt)"; fi
          if [ "$ADDED" = "true" ]; then gh issue close "$ISSUE" --reason completed; fi
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ADDED: ${{ steps.run.outputs.added }}
