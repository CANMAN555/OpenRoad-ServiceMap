name: Update truck service chains

on:
  workflow_dispatch:
  push:
    branches: [towing-other-vendors]
    paths:
      - scripts/update-mack.mjs
      - scripts/update-pomps.mjs
      - scripts/update-rush.mjs
      - scripts/lib.mjs
      - .github/workflows/update-chains.yml

permissions:
  contents: write

concurrency:
  group: update-chains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-mack.mjs
        continue-on-error: true
      - run: node scripts/update-pomps.mjs
        continue-on-error: true
      - run: node scripts/update-rush.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git add data/mack.json data/pomps.json data/rush.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Mack, Pomp's and Rush locations"
          git pull --rebase
          git push
