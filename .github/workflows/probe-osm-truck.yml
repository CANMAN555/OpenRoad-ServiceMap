name: probe-osm-truck
on: { push: { branches: [towing-other-vendors], paths: [scripts/probe-osm-truck.mjs, .github/workflows/probe-osm-truck.yml] }, workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-osm-truck.mjs
