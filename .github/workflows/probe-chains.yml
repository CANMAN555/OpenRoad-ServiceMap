name: probe-chains
on: { push: { branches: [towing-other-vendors], paths: [scripts/probe-chains.mjs, .github/workflows/probe-chains.yml] }, workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-chains.mjs
