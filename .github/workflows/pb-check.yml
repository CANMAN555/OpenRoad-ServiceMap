# Temporary: checks that the Post Board database answers from the internet (the build sandbox can't reach it).
name: Post Board database check
on:
  push:
    branches: [post-board-live]
    paths: [".github/workflows/pb-check.yml", "postboard/config.js"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the PIN-checked functions with the site's public key
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' postboard/config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' postboard/config.js)
          call() { curl -s -w " [HTTP %{http_code}]\n" -X POST "$URL/rest/v1/rpc/$1" -H "apikey: $KEY" -H "Content-Type: application/json" -H "Origin: https://canman555.github.io" -d "$2"; }
          echo "wrong PIN:   $(call pb_login '{"pin":"0000"}')"
          echo "right PIN:   $(call pb_login '{"pin":"1234"}')"
          echo "changes:     $(call pb_changes '{"pin":"1234","since":999999999}')"
          echo "table read (should be refused): $(curl -s -w ' [HTTP %{http_code}]' "$URL/rest/v1/pb_docs?select=id&limit=1" -H "apikey: $KEY")"
          echo "settings read (should be refused): $(curl -s -w ' [HTTP %{http_code}]' "$URL/rest/v1/pb_settings?select=*" -H "apikey: $KEY")"
          echo "CORS: $(curl -s -o /dev/null -D - -X OPTIONS "$URL/rest/v1/rpc/pb_login" -H 'Origin: https://canman555.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: apikey,content-type' | grep -i 'access-control-allow-origin')"
