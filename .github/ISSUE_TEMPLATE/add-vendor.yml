name: Add a vendor
description: Ask for a vendor to be added to the map. It is checked online before a pin goes up.
title: "Add vendor: "
labels: ["add-vendor"]
body:
  - type: markdown
    attributes:
      value: |
        Claude checks that the business is real before a pin goes up: it finds the vendor's own website, makes sure
        the phone number below is on it, looks up the street address and adds the store hours. You get a comment here either way.
  - type: input
    id: name
    attributes:
      label: Business name
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Towing
        - Other Vendors
    validations:
      required: true
  - type: input
    id: services
    attributes:
      label: Services
      description: Separate with commas.
      placeholder: Truck repair, Mobile repair, Tires, Towing, Trailer repair, Reefer / APU
  - type: input
    id: address
    attributes:
      label: Street address
      placeholder: 1234 Main St
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: City
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: State (2 letters)
      placeholder: TX
    validations:
      required: true
  - type: input
    id: zip
    attributes:
      label: ZIP code
  - type: input
    id: phone
    attributes:
      label: Phone number
      placeholder: (555) 555-1234
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
